; Measured opt-in for Huihui Qwen3.8-27B GSQ-RCO IQ3_S Vision DFlash2, RTX 4090 24 GB.
; Pass the exact .ninfer model path as a positional argument.
; See docs/performance/rtx4090-v014-long-context-2026-11-26.md.
model-id = qwen3.8-27b
host = 127.0.0.1
port = 8080
device = 0
max-context = 176128
kv-capacity = auto
kv-headroom-mib = 1024
kv-dtype = rk4v4
gdn-state-fp16 = true
max-concurrency = 2
kv-lease-growth = true
spec = dflash2
draft-tokens = 7
ngram-draft-tokens = 15
ngram-min-match = 12
prefill-chunk = 4096
concurrent-prefill = true
use-alt-prefix-caching = true
host-cache-mib = 16384
device-profile = auto
structured-output = true
vision = true
vision-residency = overlay
default-reasoning-effort = xhigh
recover-invariant-failures = true
