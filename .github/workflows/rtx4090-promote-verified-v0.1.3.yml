name: RTX 4090 v0.1.3 verified stable promotion
on:
  push:
    branches: [master]
    paths:
      - 'docs/releases/rtx4090-v0.1.3-gpu-verification.md'
      - '.github/workflows/rtx4090-promote-verified-v0.1.3.yml'
permissions:
  contents: write
  actions: read
jobs:
  promote:
    if: github.repository == 'spk-c/ninfer-all-rtx4090'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate immutable tag, release assets and actual GPU evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='rtx4090-v0.1.3'
          sha='8de6beb22c545003e90c404226f066ddc4f56271'
          test "$(git rev-list -n 1 "$tag")" = "$sha"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44248609133" > release-workflow.json
          python3 - <<'PY'
          import json, pathlib
          tag = 'rtx4090-v0.1.3'
          sha = '8de6beb22c545003e90c404226f066ddc4f56271'
          artifact = 'ninfer-windows-x64-cuda13.4-sm89-8de6beb22c54.7z.001'
          checksum = '97e6c4728ec24a747f6eb8b0439dab7cb63bda9639608f79e39fabb1341374d4'
          rel=json.loads(pathlib.Path('release.json').read_text())
          run=json.loads(pathlib.Path('release-workflow.json').read_text())
          proof=pathlib.Path('docs/releases/rtx4090-v0.1.3-gpu-verification.md').read_text()
          assert rel['tag_name'] == tag and not rel['draft'], 'wrong release'
          assert any(x['name'] == artifact and x['digest'] == 'sha256:'+checksum and x['state']=='uploaded' for x in rel['assets']), 'release archive mismatch'
          assert any(x['name'].startswith('SHA256SUMS-') and x['state']=='uploaded' for x in rel['assets']), 'checksum missing'
          assert run['head_sha'] == sha and run['status']=='completed' and run['conclusion']=='success', 'native release workflow not green'
          assert '**Validation: PASS (SM89 real-model inference smoke test)**' in proof
          assert sha in proof and checksum in proof
          assert 'rinfer-serve' not in proof  # guard against wrong product in evidence
          assert 'ninfer-serve rtx4090-v0.1.3+8de6beb' in proof
          assert 'Huihui-Qwen3.8-27B-GSQ-RCO-IQ3S-Vision-DFlash2.ninfer' in proof
          assert '→ **4** (pass)' in proof and '→ **Berlin** (pass)' in proof
          print('PASS: source, verified archive, successful native CI and real RTX4090 smoke evidence')
          PY
      - name: Promote GPU-tested release to stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          # NInfer RTX 4090 v0.1.3 — GPU verified (Windows CUDA 13.4 / SM89)

          **Stable release**, source `8de6beb22c545003e90c404226f066ddc4f56271`.

          - GitHub four-shard native CUDA 13.4 build, CPU CTest, portable package, archive integrity and SHA256 checks: **passed**.
          - The exact downloaded release archive was SHA256-checked and extracted. Its `ninfer-serve.exe` identifies as `rtx4090-v0.1.3+8de6beb`.
          - **Real RTX 4090 24 GiB GPU inference: passed** on Huihui-Qwen3.8 27B IQ3S Vision DFlash2 (K=5, rk4v4): correct responses to both independent smoke prompts, regular `stop` finish, model successfully loaded.
          - Windows Python tooling: 508 passed, 2 skipped. The original Windows n-gram test issue was fixed and included in this release.
          - Verification evidence: https://github.com/spk-c/ninfer-all-rtx4090/blob/master/docs/releases/rtx4090-v0.1.3-gpu-verification.md

          Scope: Windows x64 CUDA 13.4 native Ada SM89 RTX 4090 build. Real-model smoke qualified; does not claim full long-context regression coverage, 540-case A/B performance results, a speedup, or support validation of other GPU architectures. The broader multi-architecture master CI is separate from the fully successful release pipeline.
          EOF
          gh release edit rtx4090-v0.1.3 --prerelease=false --latest --title "NInfer RTX 4090 v0.1.3 - CUDA 13.4 SM89 (GPU verified)" --notes-file notes.md
          test "$(gh release view rtx4090-v0.1.3 --json isPrerelease --jq '.isPrerelease')" = false
          echo 'STABLE_PROMOTION_VERIFIED'
