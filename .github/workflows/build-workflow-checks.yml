name: Build workflow checks

on:
  push:
    branches: ['build/**']
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build-workflow-checks.yml'
      - '.github/workflows/build-cache-retention.yml'
      - '.github/workflows/native-windows.yml'
      - '.github/workflows/native-linux.yml'
      - '.github/workflows/linux-cache-bootstrap.yml'
      - 'scripts/package-release.ps1'
      - 'scripts/build.ps1'
      - 'scripts/test-rtx4090-release-smoke.ps1'
      - '.github/workflows/rtx4090-auto-release.yml'
      - '.github/actions/windows-sm89/**'
      - 'scripts/package-linux-release.py'
      - 'scripts/assemble-universal-release.py'
      - 'apps/launcher/**'
      - 'cmake/NinferRuntime.cmake'
      - 'cmake/runtime_dispatch.cpp.in'
      - 'tests/release/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate hosted RTX 4090 workflow and composite action YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('.github')
          workflow=yaml.load((root/'workflows/rtx4090-auto-release.yml').read_text(),
                             Loader=yaml.BaseLoader)
          assert set(workflow['jobs']) == {'source','release-tools','objects','package','publish'}
          assert 'self-hosted' not in str(workflow['jobs'])
          action=yaml.load((root/'actions/windows-sm89/action.yml').read_text(),
                           Loader=yaml.BaseLoader)
          assert action['runs']['using'] == 'composite'
          print('Hosted RTX 4090 workflow YAML parsed correctly')
          PY
      - run: python -m unittest discover -s tests/release -v
  windows-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Parse Windows release and build scripts
        shell: pwsh
        run: |
          foreach ($path in 'scripts/package-release.ps1', 'scripts/build.ps1', 'scripts/test-rtx4090-release-smoke.ps1') {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($path + ": " + ($parseErrors | Out-String)) }
          }
      - run: python -m unittest discover -s tests/release -p test_build_lifecycle.py -v
      - run: python -m unittest discover -s tests/release -p test_windows_kernel_dll.py -v
      - run: python -m unittest discover -s tests/release -p test_portable_runtime.py -v
