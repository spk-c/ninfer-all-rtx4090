name: Native monitor regression
on:
  pull_request:
    paths:
      - 'src/serve/monitor*'
      - 'src/serve/http_server.cpp'
      - 'tests/monitor/*'
      - '.github/workflows/monitor-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile host-only monitor test (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/monitor/smoke.cpp -pthread -ldl -o monitor-smoke
          ./monitor-smoke monitor-native.html
      - name: Compile host-only monitor test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /utf-8 /EHsc /W4 /WX /Isrc tests\monitor\smoke.cpp /Fe:monitor-smoke.exe
          if errorlevel 1 exit /b 1
          monitor-smoke.exe monitor-native.html
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Native dashboard browser fixture
        run: node tests/monitor/browser.mjs monitor-native.html
