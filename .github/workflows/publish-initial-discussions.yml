name: Publish initial project discussions
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-initial-discussions.yml'
      - 'docs/maintainer/discussion-posts.json'
      - 'scripts/publish-initial-discussions.py'
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
concurrency:
  group: initial-discussions
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'spk-c/ninfer-all-rtx4090'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish curated posts (idempotent by exact title)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-initial-discussions.py --apply
