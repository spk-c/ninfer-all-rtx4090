name: One-time upstream merge (RTX 4090)

on:
  push:
    branches:
      - chore/sync-upstream-20261110
    paths:
      - .github/workflows/sync-upstream-once.yml

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate upstream while preserving fork-specific conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/iamwavecut/ninfer-all.git
          git fetch --no-tags upstream master
          echo "Fork before merge: $(git rev-parse HEAD)"
          echo "Upstream: $(git rev-parse upstream/master)"
          test "$(git rev-parse upstream/master)" = "6e71b0ed02d46735fffb6ca609710d8cf70e19e9"
          if ! git merge --no-ff --no-commit upstream/master; then
            echo "Conflicts from the normal merge:"
            git diff --name-only --diff-filter=U | tee /tmp/upstream-conflicts.txt
            {
              echo "## Files requiring conflict resolution"
              sed 's/^/- `/;s/$/`/' /tmp/upstream-conflicts.txt
              echo ""
              echo "Retrying with the fork's hunk preferred only where Git cannot auto-merge."
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            if ! git merge --no-ff --no-commit -X ours upstream/master; then
              echo "The merge still has unresolved conflicts; refusing to publish."
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi
          if git ls-files -u | grep -q .; then
            echo "Unresolved index entries remain; refusing to publish."
            exit 1
          fi
          if ! git diff --cached --check; then
            echo "Whitespace issues in merged changes; refusing to publish."
            exit 1
          fi
          git commit -m "Merge iamwavecut/ninfer-all upstream master into RTX4090 fork"
          git merge-base --is-ancestor upstream/master HEAD
          echo "Merged commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git rm -f .github/workflows/sync-upstream-once.yml
          git commit -m "chore: remove temporary upstream sync workflow"
          git push origin HEAD:refs/heads/chore/sync-upstream-20261110
