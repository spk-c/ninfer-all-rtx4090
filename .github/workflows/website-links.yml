name: Website external link audit
on:
  workflow_dispatch:
  schedule:
    - cron: '12 7 * * 1'
  push:
    branches: [master]
    paths:
      - '.github/workflows/website-links.yml'
      - 'scripts/check-website-external.py'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - run: python3 scripts/check-website-external.py site
