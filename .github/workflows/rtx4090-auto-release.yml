# Four GitHub-hosted CUDA object shards, one final Windows linker and prerelease.
# No real RTX 4090 on hosted runners: stable promotion requires separate GPU proof.
name: RTX 4090 automatic Windows release
on:
  push:
    tags: ['rtx4090-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag (rtx4090-vX.Y.Z)
        type: string
        required: true
      publish:
        description: Publish as GPU-unverified prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rtx4090-hosted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'spk-c/ninfer-all-rtx4090'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$(echo "$GITHUB_REF" | sed 's|^refs/tags/||')"
          fi
          [[ "$tag" =~ ^rtx4090-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$(git rev-parse "refs/tags/$tag^{commit}")" ]] || exit 1
          git fetch --quiet origin master
          git merge-base --is-ancestor "$sha" origin/master || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  release-tools:
    needs: source
    uses: ./.github/workflows/build-workflow-checks.yml
  objects:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: pwsh
    env:
      NINFER_VERSION: ${{ needs.source.outputs.tag }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/objects
      CCACHE_MAXSIZE: 1100M
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: 'true'
      CCACHE_COMPRESSLEVEL: '5'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: ./.github/actions/windows-sm89
      - name: Compile deterministic CUDA object subset
        timeout-minutes: 275
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python .github/scripts/build-object-shard.py --build build-release --shard $env:SHARD --count 4 --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Object shard compilation failed' }
          ccache --cleanup
      - name: Create verified shard archive
        env:
          SHARD: ${{ matrix.shard }}
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          python .github/scripts/rtx4090-shard-cache.py pack --source .cache/objects --objects build-release/object-shard.json --output build-shard/cache.zip --revision $env:SHA --shard $env:SHARD --count 4
          if ($LASTEXITCODE -ne 0) { throw 'ccache archive failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: rtx4090-objects-${{ matrix.shard }}
          path: build-shard/cache.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
  package:
    needs: [source, release-tools, objects]
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      NINFER_VERSION: ${{ needs.source.outputs.tag }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/objects
      CCACHE_MAXSIZE: 8Gi
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: 'true'
      CCACHE_COMPRESSLEVEL: '5'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: ./.github/actions/windows-sm89
      - uses: actions/download-artifact@v8
        with:
          pattern: rtx4090-objects-*
          path: incoming-shards
          merge-multiple: false
      - name: Restore and verify four compiler caches and full object graph
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          python .github/scripts/rtx4090-shard-cache.py restore --input incoming-shards --dest .cache/objects --build build-release --revision $env:SHA --count 4
          if ($LASTEXITCODE -ne 0) { throw 'Shard restore failed' }
      - name: Link six portable programs and enforce compiler-cache hits
        timeout-minutes: 260
        run: |
          ccache --zero-stats
          cmake --build build-release --parallel 2 --target ninfer ninfer-serve ninfer_bench ninfer-calibrate ninfer-perplexity ninfer-ngram-profile
          if ($LASTEXITCODE -ne 0) { throw 'CUDA executable link failed' }
          python .github/scripts/rtx4090-shard-cache.py check-hits --minimum 40
          if ($LASTEXITCODE -ne 0) { throw 'Sharded cache not reused' }
      - name: Build test targets and run CPU CTest
        timeout-minutes: 75
        run: |
          python -m pip install --disable-pip-version-check pytest jinja2 numpy safetensors
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies unavailable' }
          cmake --build build-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
          ctest --test-dir build-release --parallel 2 --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native CTest failed' }
      - name: Package and verify Windows CUDA 13.4 SM89 release
        timeout-minutes: 45
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          $env:NINFER_BUILD_ROOT=Join-Path $pwd 'build-release'
          & .\scripts\package-release.ps1
          if (-not $?) { throw 'Package verification failed' }
          $name="ninfer-windows-x64-cuda13.4-sm89-$($env:SHA.Substring(0,12))"
          $info=Get-Content (Join-Path $pwd "dist/$name/BUILD-INFO.json") -Raw | ConvertFrom-Json
          if ($info.source_revision -ne $env:SHA -or $info.version -ne $env:NINFER_VERSION -or
              $info.cuda -ne '13.4' -or $info.modified_sources -or @($info.architectures).Count -ne 1 -or
              $info.architectures[0] -ne '89') { throw 'Wrong archive identity' }
          $parts=@(Get-ChildItem dist -File | Where-Object { $_.Name -match ('^'+[regex]::Escape($name)+'[.]7z[.][0-9]{3}$') } | Sort-Object Name)
          $sum=Join-Path $pwd "dist/SHA256SUMS-$name.txt"
          if (-not $parts.Count -or -not (Test-Path $sum)) { throw 'Missing archives' }
          $rows=@(Get-Content $sum | Where-Object { $_ -match '\S' })
          if ($rows.Count -ne $parts.Count) { throw 'Checksum manifest incomplete' }
          for($i=0;$i -lt $parts.Count;$i++){
            $fields=$rows[$i] -split '\s{2,}',2
            if ($fields.Count -ne 2 -or $fields[1] -ne $parts[$i].Name -or
                $fields[0].ToLowerInvariant() -ne (Get-FileHash $parts[$i].FullName -Algorithm SHA256).Hash.ToLowerInvariant()){
              throw "SHA256 mismatch: $($parts[$i].Name)"
            }
          }
          & 7z t $parts[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Archive integrity failed' }
          Write-Host 'Cloud binary is GPU-unverified; only prerelease allowed.'
      - uses: actions/upload-artifact@v7
        with:
          name: rtx4090-verified-windows-release
          path: |
            dist/*.7z.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rtx4090-final-build-logs
          path: |
            build-release/Testing/Temporary/LastTest.log
            build-release/Testing/Temporary/LastTestsFailed.log
            build-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
  publish:
    if: github.event_name == 'push' || inputs.publish == true
    needs: [source, release-tools, objects, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: rtx4090-verified-windows-release
          path: release-assets
      - name: Publish GPU-unverified prerelease; never overwrite a stable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || exit 1
          remote="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [[ ! "$remote" =~ ^[0-9a-f]{40}$ ]]; then
            remote="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          fi
          [[ "$remote" == "$RELEASE_SHA" ]] || exit 1
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists' >&2; exit 1
          fi
          compgen -G 'release-assets/*.7z.*' >/dev/null
          compgen -G 'release-assets/SHA256SUMS-*.txt' >/dev/null
          printf '# NInfer RTX 4090 %s\n\nWindows CUDA 13.4 SM89, source %s.\n\nFour GitHub-hosted object shards, CPU CTest, package and SHA256 verified.\n\n**GPU-unverified prerelease:** a separate real RTX 4090 model-inference test is mandatory before stable promotion.\n' "$RELEASE_TAG" "$RELEASE_SHA" > notes.md
          gh release create "$RELEASE_TAG" release-assets/*.7z.* release-assets/SHA256SUMS-*.txt --verify-tag --prerelease --title "NInfer RTX 4090 $RELEASE_TAG - CUDA 13.4 (GPU unverified)" --notes-file notes.md
          gh release view "$RELEASE_TAG" --json isPrerelease,assets --jq '{pre: .isPrerelease, names: [.assets[].name]}' > uploaded.json
          python3 - <<'PY'
          import json, glob, pathlib
          item=json.load(open('uploaded.json'))
          expected={pathlib.Path(p).name for p in glob.glob('release-assets/*')}
          if not item['pre'] or set(item['names']) != expected: raise SystemExit('Remote assets mismatch')
          print('Verified prerelease assets:', sorted(expected))
          PY
