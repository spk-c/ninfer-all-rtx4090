name: Website browser regression
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/website-browser.yml'
      - 'scripts/check-website-browser.mjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Static SEO and syntax
        run: |
          python3 scripts/check-website-seo.py site
          node --check site/site.js
          node --check site/tools.js
      - name: Browser interactions
        run: node scripts/check-website-browser.mjs
